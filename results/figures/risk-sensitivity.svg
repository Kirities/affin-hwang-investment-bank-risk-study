<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title description">
<title id="title">Risk prioritization and sensitivity to ordinal inputs</title><desc id="description">Illustrative source assumptions | baseline score and local +/-1 input range</desc>
<rect width="100%" height="100%" fill="#f7f9fc"/>
<style>text{font-family:Arial,sans-serif;fill:#14283f} .title{font-size:26px;font-weight:bold} .sub{font-size:15px;fill:#526277} .label{font-size:16px} .small{font-size:14px}</style>
<text x="45" y="48" class="title">Risk prioritization and sensitivity to ordinal inputs</text>
<text x="45" y="78" class="sub">Illustrative source assumptions | baseline score and local +/-1 input range</text>
<text x="45" y="126" class="label">Market</text>
<path d="M580 120H905" stroke="#526b85" stroke-width="8"/>
<circle cx="780" cy="120" r="8" fill="#1f5a85"/>
<text x="940" y="126" class="label">20 (High)</text>
<text x="45" y="183" class="label">Compliance</text>
<path d="M505 177H905" stroke="#526b85" stroke-width="8"/>
<circle cx="680" cy="177" r="8" fill="#1f5a85"/>
<text x="940" y="183" class="label">16 (High)</text>
<text x="45" y="240" class="label">Credit</text>
<path d="M430 234H780" stroke="#526b85" stroke-width="8"/>
<circle cx="580" cy="234" r="8" fill="#1f5a85"/>
<text x="940" y="240" class="label">12 (High)</text>
<text x="45" y="297" class="label">Technology</text>
<path d="M355 291H655" stroke="#526b85" stroke-width="8"/>
<circle cx="480" cy="291" r="8" fill="#1f5a85"/>
<text x="940" y="297" class="label">8 (Medium)</text>
<text x="45" y="354" class="label">Operational</text>
<path d="M330 348H580" stroke="#526b85" stroke-width="8"/>
<circle cx="430" cy="348" r="8" fill="#1f5a85"/>
<text x="940" y="354" class="label">6 (Medium)</text>
<text x="45" y="411" class="label">Liquidity</text>
<path d="M330 405H580" stroke="#526b85" stroke-width="8"/>
<circle cx="430" cy="405" r="8" fill="#1f5a85"/>
<text x="940" y="411" class="label">6 (Medium)</text>
<text x="45" y="468" class="label">Strategic</text>
<path d="M330 462H580" stroke="#526b85" stroke-width="8"/>
<circle cx="430" cy="462" r="8" fill="#1f5a85"/>
<text x="940" y="468" class="label">6 (Medium)</text>
<text x="305" y="550" text-anchor="middle" class="small">1</text>
<text x="405" y="550" text-anchor="middle" class="small">5</text>
<text x="530" y="550" text-anchor="middle" class="small">10</text>
<text x="655" y="550" text-anchor="middle" class="small">15</text>
<text x="780" y="550" text-anchor="middle" class="small">20</text>
<text x="905" y="550" text-anchor="middle" class="small">25</text>
<text x="45" y="598" class="small">Ranges enumerate valid neighboring score pairs; they are not confidence intervals.</text>
</svg>